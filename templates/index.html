<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Risk Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Base reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }

    /* ── Layout grid ──────────────────────────────────────────── */
    #shell {
      display: grid;
      grid-template-columns: 48px 240px 1fr;
      grid-template-rows: 36px 1fr 24px;
      grid-template-areas:
        "rail sidebar titlebar"
        "rail sidebar main"
        "rail sidebar statusbar";
      height: 100vh;
      width: 100vw;
    }
    #shell.sidebar-collapsed {
      grid-template-columns: 48px 0px 1fr;
    }
    #shell.panel-open {
      grid-template-columns: 48px 240px 1fr 320px;
      grid-template-areas:
        "rail sidebar titlebar panel"
        "rail sidebar main     panel"
        "rail sidebar statusbar panel";
    }
    #shell.sidebar-collapsed.panel-open {
      grid-template-columns: 48px 0px 1fr 320px;
    }

    /* ── Icon rail ────────────────────────────────────────────── */
    #rail {
      grid-area: rail;
      background: #161b22;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      gap: 4px;
      z-index: 10;
    }
    .rail-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; cursor: pointer; color: #8b949e;
      transition: background .15s, color .15s;
      border: none; background: transparent;
      font-size: 16px;
    }
    .rail-btn:hover { background: #21262d; color: #c9d1d9; }
    .rail-btn.active { color: #58a6ff; background: #1f2937; }
    .rail-spacer { flex: 1; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      grid-area: sidebar;
      background: #161b22;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s;
    }
    #shell.sidebar-collapsed #sidebar { width: 0; border: none; }

    .sidebar-section-header {
      padding: 8px 12px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #8b949e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      flex-shrink: 0;
    }
    .sidebar-section-header button {
      background: none; border: none; cursor: pointer;
      color: #8b949e; font-size: 14px; line-height: 1;
      padding: 0 2px; border-radius: 3px;
    }
    .sidebar-section-header button:hover { color: #c9d1d9; background: #21262d; }

    .file-tree { overflow-y: auto; flex: 1; padding-bottom: 8px; }
    .tree-folder {
      padding: 3px 12px 3px 12px;
      cursor: pointer;
      color: #c9d1d9;
      display: flex; align-items: center; gap: 6px;
      user-select: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tree-folder:hover { background: #1f2937; }
    .tree-folder .chevron { font-size: 9px; color: #8b949e; transition: transform .15s; display:inline-block; }
    .tree-folder.open .chevron { transform: rotate(90deg); }
    .tree-file {
      padding: 3px 12px 3px 28px;
      cursor: pointer;
      color: #8b949e;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tree-file:hover { background: #1f2937; color: #c9d1d9; }
    .tree-file.active { background: #1f6feb22; color: #58a6ff; }
    .tree-file.changed { color: #e3b341; }
    .tree-file.changed.active { color: #58a6ff; }
    .tree-file .file-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #e3b341; flex-shrink: 0; margin-left: auto;
    }

    /* ── Title bar (tabs) ─────────────────────────────────────── */
    #titlebar {
      grid-area: titlebar;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #titlebar::-webkit-scrollbar { display: none; }
    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 0 14px 0 12px;
      min-width: 120px; max-width: 200px;
      border-right: 1px solid #21262d;
      cursor: pointer;
      color: #8b949e;
      font-size: 12px;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    .tab:hover { background: #161b22; color: #c9d1d9; }
    .tab.active { background: #0d1117; color: #c9d1d9; border-bottom: 2px solid #58a6ff; }
    .tab .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .tab .tab-close {
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 3px; font-size: 11px; line-height: 1;
      background: none; border: none; cursor: pointer; color: #8b949e;
      flex-shrink: 0;
    }
    .tab .tab-close:hover { background: #21262d; color: #c9d1d9; }
    .tab .tab-changed { width: 7px; height: 7px; border-radius: 50%; background: #e3b341; flex-shrink: 0; }
    #tab-add {
      padding: 0 12px;
      cursor: pointer; color: #8b949e; font-size: 16px;
      display: flex; align-items: center;
      background: none; border: none;
      flex-shrink: 0;
    }
    #tab-add:hover { color: #c9d1d9; }

    /* ── Main editor area ─────────────────────────────────────── */
    #main {
      grid-area: main;
      background: #0d1117;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Welcome / empty state */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #8b949e;
    }
    #welcome .logo { font-size: 48px; }
    #welcome h2 { font-size: 20px; font-weight: 600; color: #c9d1d9; }
    #welcome p { font-size: 13px; color: #8b949e; text-align: center; max-width: 320px; line-height: 1.6; }
    #welcome kbd {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 4px; padding: 2px 6px; font-size: 11px;
      font-family: monospace; color: #c9d1d9;
    }

    /* Diff viewer */
    #diffViewer {
      flex: 1;
      overflow-y: auto;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .diff-hunk-header {
      background: #1c2128;
      color: #8b949e;
      padding: 3px 16px;
      font-size: 11px;
      border-top: 1px solid #21262d;
      border-bottom: 1px solid #21262d;
      user-select: none;
    }
    .diff-line {
      display: flex;
      align-items: stretch;
    }
    .diff-line:hover { filter: brightness(1.12); }
    .diff-line-num {
      min-width: 52px;
      padding: 0 10px;
      text-align: right;
      color: #484f58;
      border-right: 1px solid #21262d;
      user-select: none;
      flex-shrink: 0;
      font-size: 11px;
    }
    .diff-line-content {
      padding: 0 16px;
      white-space: pre;
      flex: 1;
      overflow-x: visible;
    }
    .diff-line.added   { background: #0f2d1a; }
    .diff-line.added   .diff-line-num   { background: #0d2e1b; color: #3fb950; }
    .diff-line.added   .diff-line-content { color: #aff0c0; }
    .diff-line.added   .diff-line-content::before { content: '+'; color: #3fb950; margin-right: 10px; }
    .diff-line.removed { background: #2d0f0f; }
    .diff-line.removed .diff-line-num   { background: #2e0e0e; color: #f85149; }
    .diff-line.removed .diff-line-content { color: #f4a5a5; }
    .diff-line.removed .diff-line-content::before { content: '-'; color: #f85149; margin-right: 10px; }
    .diff-line.context .diff-line-content::before { content: ' '; margin-right: 10px; color: transparent; }
    .diff-file-header {
      background: #161b22;
      border-top: 1px solid #21262d;
      border-bottom: 1px solid #21262d;
      padding: 6px 16px;
      color: #8b949e;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .diff-file-header .file-path { color: #c9d1d9; font-weight: 600; }

    /* ── Review panel ─────────────────────────────────────────── */
    #panel {
      grid-area: panel;
      background: #161b22;
      border-left: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      border-bottom: 1px solid #21262d;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #8b949e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-header button {
      background: none; border: none; cursor: pointer;
      color: #8b949e; font-size: 14px;
    }
    .panel-header button:hover { color: #c9d1d9; }
    .panel-body { overflow-y: auto; flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
    .panel-section { display: flex; flex-direction: column; gap: 6px; }
    .panel-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #8b949e;
    }

    /* Risk badge */
    .risk-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em;
    }
    .risk-badge.low    { background: #0f2d1a; color: #3fb950; border: 1px solid #1a4731; }
    .risk-badge.medium { background: #2d1f00; color: #e3b341; border: 1px solid #4a3200; }
    .risk-badge.high   { background: #2d0f0f; color: #f85149; border: 1px solid #5c1a1a; }
    .risk-badge.unknown{ background: #1c2128; color: #8b949e; border: 1px solid #30363d; }
    .risk-dot { width: 8px; height: 8px; border-radius: 50%; }
    .risk-badge.low    .risk-dot { background: #3fb950; }
    .risk-badge.medium .risk-dot { background: #e3b341; }
    .risk-badge.high   .risk-dot { background: #f85149; }
    .risk-badge.unknown .risk-dot { background: #8b949e; }

    .summary-text {
      font-size: 12px; line-height: 1.65; color: #c9d1d9;
      background: #0d1117; border: 1px solid #21262d;
      border-radius: 6px; padding: 10px 12px;
    }

    .file-chip {
      font-family: monospace; font-size: 11px;
      background: #0d1117; border: 1px solid #21262d;
      border-radius: 4px; padding: 3px 8px; color: #8b949e;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    .file-chip:hover { border-color: #58a6ff; color: #58a6ff; }
    .file-chip .chip-icon { color: #e3b341; }
    .file-chips { display: flex; flex-wrap: wrap; gap: 4px; }

    .symbol-chip {
      font-family: monospace; font-size: 11px;
      background: #1c2a4a; border: 1px solid #1f4080;
      border-radius: 4px; padding: 2px 8px; color: #79c0ff;
    }
    .symbol-chips { display: flex; flex-wrap: wrap; gap: 4px; }

    .test-card {
      background: #0d1117;
      border: 1px solid #21262d;
      border-left: 3px solid #58a6ff;
      border-radius: 0 6px 6px 0;
      padding: 8px 12px;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .test-card .test-num {
      color: #58a6ff; font-weight: 700; font-size: 11px;
      flex-shrink: 0; min-width: 16px;
    }
    .test-card .test-text { font-size: 12px; line-height: 1.5; color: #c9d1d9; }

    /* panel toggle button in titlebar */
    #btn-panel-toggle {
      margin-left: auto;
      padding: 0 12px;
      cursor: pointer; color: #8b949e; font-size: 13px;
      display: flex; align-items: center; gap: 5px;
      background: none; border: none; border-left: 1px solid #21262d;
      flex-shrink: 0; white-space: nowrap;
    }
    #btn-panel-toggle:hover { color: #c9d1d9; }
    #btn-panel-toggle.active { color: #58a6ff; }

    /* ── Status bar ───────────────────────────────────────────── */
    #statusbar {
      grid-area: statusbar;
      background: #1f6feb;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 16px;
      font-size: 11px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
    }
    .status-item { display: flex; align-items: center; gap: 5px; opacity: .9; }
    #statusRisk { font-weight: 700; margin-left: auto; padding: 0 10px; }

    /* ── Modal ────────────────────────────────────────────────── */
    #modal-overlay {
      position: fixed; inset: 0;
      background: #00000099;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #modal-overlay.hidden { display: none; }
    #modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 480px;
      box-shadow: 0 24px 64px #000a;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #21262d;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 14px; font-weight: 600; color: #c9d1d9; }
    .modal-header button { background: none; border: none; cursor: pointer; color: #8b949e; font-size: 18px; }
    .modal-header button:hover { color: #c9d1d9; }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-field { display: flex; flex-direction: column; gap: 5px; }
    .modal-field label { font-size: 12px; font-weight: 500; color: #8b949e; }
    .modal-field input,
    .modal-field textarea {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #c9d1d9;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .modal-field input:focus,
    .modal-field textarea:focus { border-color: #58a6ff; }
    .modal-field textarea { font-family: 'SF Mono', Consolas, monospace; resize: vertical; min-height: 80px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #21262d;
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-cancel {
      padding: 6px 14px; background: none;
      border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; cursor: pointer; font-size: 12px;
    }
    .btn-cancel:hover { border-color: #8b949e; color: #c9d1d9; }
    .btn-primary {
      padding: 6px 16px;
      background: #238636; border: 1px solid #2ea043;
      border-radius: 6px; color: #fff; cursor: pointer;
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid #ffffff44;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
  </style>
</head>
<body>

<!-- ═══════════════════ SHELL ═══════════════════ -->
<div id="shell">

  <!-- Icon Rail -->
  <nav id="rail">
    <div style="font-size:20px;padding:6px 0 10px;color:#58a6ff;user-select:none">🛡️</div>

    <button class="rail-btn active" id="btn-rail-prs" title="Pull Requests" onclick="railSelect('prs')">
      <!-- PR icon -->
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
        <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h.538A1.962 1.962 0 0 1 12.5 4.462v9.538a2.25 2.25 0 1 1-1.5 0V4.462a.462.462 0 0 0-.462-.462H10v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354Z"/>
      </svg>
    </button>

    <button class="rail-btn" id="btn-rail-files" title="Files" onclick="railSelect('files')">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
        <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688Z"/>
      </svg>
    </button>

    <div class="rail-spacer"></div>

    <button class="rail-btn" title="New analysis (N)" onclick="openModal()" style="margin-bottom:4px">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
        <path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/>
      </svg>
    </button>

    <button class="rail-btn" title="Settings" style="margin-bottom:8px" onclick="openModal()">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
        <path fill-rule="evenodd" d="M7.429 1.525a6.593 6.593 0 0 1 1.142 0c.036.003.108.036.137.146l.289 1.105c.147.56.55.967.997 1.189.174.086.341.183.501.29.417.278.97.423 1.53.27l1.102-.303c.11-.03.175.016.195.046.219.31.41.641.573.989.063.13.02.205-.015.234l-.88.768c-.408.357-.599.895-.572 1.422.007.107.007.215 0 .322-.027.527.164 1.065.572 1.422l.88.768c.035.029.078.104.015.235a6.58 6.58 0 0 1-.573.988c-.02.03-.085.076-.195.046l-1.103-.303c-.559-.153-1.112-.008-1.529.27-.16.107-.327.204-.5.29-.449.222-.851.628-.998 1.189l-.289 1.105c-.029.11-.101.143-.137.146a6.613 6.613 0 0 1-1.142 0c-.036-.003-.108-.037-.137-.146l-.289-1.105c-.147-.56-.55-.967-.997-1.189a4.502 4.502 0 0 1-.501-.29c-.417-.278-.97-.423-1.53-.27l-1.102.303c-.11.03-.175-.016-.195-.046a6.585 6.585 0 0 1-.574-.989c-.062-.13-.02-.205.015-.234l.881-.768c.408-.357.599-.895.572-1.422a5.112 5.112 0 0 1 0-.322c.027-.527-.164-1.065-.572-1.422l-.88-.768c-.036-.029-.078-.104-.016-.235a6.582 6.582 0 0 1 .574-.988c.02-.03.085-.076.195-.046l1.103.303c.559.153 1.112.008 1.529-.27.16-.107.327-.204.5-.29.449-.222.851-.628.998-1.189l.289-1.105c.029-.11.101-.143.137-.146ZM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/>
      </svg>
    </button>
  </nav>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-section-header">
      <span id="sidebar-label">Pull Requests</span>
      <button onclick="openModal()" title="New analysis">＋</button>
    </div>
    <div class="file-tree" id="fileTree">
      <div style="padding:24px 12px;color:#484f58;font-size:12px;line-height:1.8;text-align:center">
        No PR loaded.<br>
        <span style="color:#8b949e;cursor:pointer" onclick="openModal()">＋ Analyze a PR</span>
      </div>
    </div>
  </aside>

  <!-- Title Bar / Tabs -->
  <div id="titlebar">
    <button id="tab-add" title="New analysis" onclick="openModal()">＋</button>
    <button id="btn-panel-toggle" title="Toggle AI Review panel (B)" onclick="togglePanel()">
      🤖 AI Review
    </button>
  </div>

  <!-- Main Editor -->
  <div id="main">
    <div id="welcome">
      <div class="logo">🛡️</div>
      <h2>PR Risk Radar</h2>
      <p>Analyze any GitHub pull request for risk, blast radius, and missing tests.</p>
      <p style="margin-top:4px">
        <kbd>N</kbd>&nbsp; New analysis &nbsp;·&nbsp; <kbd>B</kbd>&nbsp; Toggle review panel
      </p>
    </div>
    <div id="diffViewer" style="display:none"></div>
  </div>

  <!-- Review Panel -->
  <aside id="panel" style="display:none">
    <div class="panel-header">
      <span>🤖 AI Review</span>
      <button onclick="togglePanel()" title="Close">✕</button>
    </div>
    <div class="panel-body" id="panelBody">
      <div style="color:#484f58;font-size:12px;font-style:italic">Run an analysis to see results here.</div>
    </div>
  </aside>

  <!-- Status Bar -->
  <div id="statusbar">
    <div class="status-item">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M8 0a8.2 8.2 0 0 1 .701.031C9.444.095 9.99.645 10.16 1.29l.288 1.107c.018.066.079.158.212.224.231.114.454.243.668.386.123.082.233.09.299.071l1.103-.303c.644-.176 1.392.021 1.82.63.27.385.506.792.704 1.218.315.675.111 1.422-.364 1.891l-.814.806c-.049.048-.098.147-.088.294.016.257.016.515 0 .772-.01.147.038.246.088.294l.814.806c.475.469.679 1.216.364 1.891a7.977 7.977 0 0 1-.704 1.217c-.428.61-1.176.807-1.82.63l-1.102-.302c-.067-.019-.177-.011-.3.071a5.909 5.909 0 0 1-.668.386c-.133.066-.194.158-.211.224l-.29 1.106c-.168.646-.715 1.196-1.458 1.26a8.006 8.006 0 0 1-1.402 0c-.743-.064-1.289-.614-1.458-1.26l-.289-1.106c-.018-.066-.079-.158-.212-.224a5.738 5.738 0 0 1-.668-.386c-.123-.082-.233-.09-.299-.071l-1.103.303c-.644.176-1.392-.021-1.82-.63a8.12 8.12 0 0 1-.704-1.218c-.315-.675-.111-1.422.363-1.891l.815-.806c.05-.048.098-.147.088-.294a6.214 6.214 0 0 1 0-.772c.01-.147-.038-.246-.088-.294l-.815-.806C.635 6.045.431 5.298.746 4.623a7.92 7.92 0 0 1 .704-1.217c.428-.61 1.176-.807 1.82-.63l1.103.303c.066.019.176.011.299-.071.214-.143.437-.272.668-.386.133-.066.194-.158.211-.224l.29-1.106C6.717.645 7.263.095 8.006.031A8.19 8.19 0 0 1 8 0Zm-.5 4.5a3.5 3.5 0 1 0 1 0V1.5h-1Z"/></svg>
      <span id="statusRepo">PR Risk Radar</span>
    </div>
    <div class="status-item" id="statusPR" style="display:none">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h.538A1.962 1.962 0 0 1 12.5 4.462v9.538a2.25 2.25 0 1 1-1.5 0V4.462a.462.462 0 0 0-.462-.462H10v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354Z"/></svg>
      <span id="statusPRText"></span>
    </div>
    <span id="statusRisk" style="display:none;margin-left:auto;font-weight:700;padding:0 10px"></span>
  </div>

</div><!-- /shell -->

<!-- ═══════════════════ MODAL ═══════════════════ -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div class="modal-header">
      <h3>🛡️&nbsp; Analyze Pull Request</h3>
      <button onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label for="mPrUrl">PR URL &nbsp;<span style="color:#484f58;font-weight:400">or</span>&nbsp; <code style="background:#0d1117;padding:1px 4px;border-radius:3px;font-size:11px">owner/repo#123</code></label>
        <input id="mPrUrl" type="text" placeholder="https://github.com/owner/repo/pull/42" />
      </div>
      <div class="modal-field">
        <label for="mToken">GitHub Token <span style="color:#484f58;font-weight:400">(required for PR URL)</span></label>
        <input id="mToken" type="password" placeholder="ghp_••••••••••••••••" />
      </div>
      <div class="modal-field">
        <label for="mDiff">Raw Diff <span style="color:#484f58;font-weight:400">(optional — paste unified diff directly)</span></label>
        <textarea id="mDiff" placeholder="diff --git a/src/auth.py b/src/auth.py&#10;--- a/src/auth.py&#10;+++ b/src/auth.py&#10;..."></textarea>
      </div>
      <div id="modal-error" style="display:none;background:#2d0f0f;border:1px solid #5c1a1a;border-radius:6px;padding:8px 12px;font-size:12px;color:#f85149"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="btnAnalyze" onclick="runAnalysis()">
        <span id="btnSpinner" style="display:none" class="spinner"></span>
        <span id="btnLabel">⚡ Analyze PR</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════ JS ═══════════════════════ -->
<script>
// ── State ──────────────────────────────────────────────────────
const state = {
  tabs: [],
  activeTab: null,
  analysis: null,
  rawDiff: '',
  panelOpen: false,
  sidebarOpen: true,
};

// ── Helpers ────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ── Rail nav ───────────────────────────────────────────────────
function railSelect(view) {
  document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-rail-' + view)?.classList.add('active');
  document.getElementById('sidebar-label').textContent =
    view === 'prs' ? 'Pull Requests' : 'Changed Files';
}

// ── Sidebar toggle (double-click rail) ────────────────────────
document.getElementById('rail').addEventListener('dblclick', () => {
  state.sidebarOpen = !state.sidebarOpen;
  document.getElementById('shell').classList.toggle('sidebar-collapsed', !state.sidebarOpen);
});

// ── Modal ──────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-error').style.display = 'none';
  setTimeout(() => document.getElementById('mPrUrl').focus(), 50);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  resetBtn();
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Keyboard shortcuts ─────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && !inInput && !document.getElementById('modal-overlay').classList.contains('hidden')) runAnalysis();
  if (e.key === 'n' && !inInput && document.getElementById('modal-overlay').classList.contains('hidden')) openModal();
  if (e.key === 'b' && !inInput) togglePanel();
});

// ── Analysis ───────────────────────────────────────────────────
function setLoading(on) {
  const btn = document.getElementById('btnAnalyze');
  const spinner = document.getElementById('btnSpinner');
  const label = document.getElementById('btnLabel');
  btn.disabled = on;
  spinner.style.display = on ? 'inline-block' : 'none';
  label.textContent = on ? 'Analyzing…' : '⚡ Analyze PR';
}

function resetBtn() {
  setLoading(false);
}

async function runAnalysis() {
  const prUrl = document.getElementById('mPrUrl').value.trim();
  const token = document.getElementById('mToken').value.trim();
  const diff  = document.getElementById('mDiff').value.trim();
  const errEl = document.getElementById('modal-error');

  errEl.style.display = 'none';

  if (!prUrl && !diff) {
    errEl.textContent = '⚠ Provide a PR URL or paste a raw diff.';
    errEl.style.display = 'block';
    return;
  }

  setLoading(true);

  const body = {};
  if (prUrl)  body.pr_url = prUrl;
  if (token)  body.github_token = token;
  if (diff)   body.diff = diff;

  try {
    const resp = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || JSON.stringify(data));

    state.analysis = data;
    state.rawDiff  = diff || '';   // store raw diff for viewer
    closeModal();
    renderAll(data, prUrl || 'Raw Diff');
  } catch (err) {
    errEl.textContent = '⚠ ' + err.message;
    errEl.style.display = 'block';
    setLoading(false);
  }
}

// ── Render everything ──────────────────────────────────────────
function renderAll(data, prLabel) {
  // Clear tabs
  state.tabs = [];
  document.querySelectorAll('.tab').forEach(t => t.remove());
  state.activeTab = null;

  // Add a tab per changed file
  (data.changed_files || []).forEach(path => addTab(path));

  // File tree
  buildFileTree(data);

  // Activate first tab
  if (state.tabs.length) activateTab(state.tabs[0]);

  // Panel
  buildPanel(data);
  if (!state.panelOpen) togglePanel();

  // Status bar
  document.getElementById('statusRepo').textContent = prLabel;
  const prStat = document.getElementById('statusPR');
  prStat.style.display = 'flex';
  document.getElementById('statusPRText').textContent =
    `${(data.changed_files||[]).length} file(s) · ${(data.changed_symbols||[]).length} symbol(s)`;

  const riskColors = { low:'#3fb950', medium:'#e3b341', high:'#f85149', unknown:'#94a3b8' };
  const risk = (data.risk_level||'unknown').toLowerCase();
  const riskEl = document.getElementById('statusRisk');
  riskEl.style.display = 'block';
  riskEl.textContent = '⬤ ' + risk.toUpperCase();
  riskEl.style.color = riskColors[risk] || '#94a3b8';
}

// ── Tabs ───────────────────────────────────────────────────────
function addTab(path) {
  state.tabs.push(path);
  const name = path.split('/').pop();
  const bar  = document.getElementById('titlebar');
  const panelBtn = document.getElementById('btn-panel-toggle');

  const el = document.createElement('div');
  el.className = 'tab';
  el.id = 'tab-el-' + btoa(path).replace(/=/g,'');
  el.title = path;
  el.innerHTML = `
    <span class="tab-changed"></span>
    <span class="tab-name">${esc(name)}</span>
    <button class="tab-close" title="Close">✕</button>`;
  el.addEventListener('click', (e) => { if (!e.target.classList.contains('tab-close')) activateTab(path); });
  el.querySelector('.tab-close').addEventListener('click', (e) => { e.stopPropagation(); closeTab(path); });
  bar.insertBefore(el, panelBtn);
}

function activateTab(path) {
  state.activeTab = path;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-el-' + btoa(path).replace(/=/g,''))?.classList.add('active');

  document.querySelectorAll('.tree-file').forEach(f => f.classList.remove('active'));
  document.getElementById('tree-file-' + btoa(path).replace(/=/g,''))?.classList.add('active');

  renderDiff(path);
}

function closeTab(path) {
  state.tabs = state.tabs.filter(t => t !== path);
  document.getElementById('tab-el-' + btoa(path).replace(/=/g,''))?.remove();
  document.getElementById('tree-file-' + btoa(path).replace(/=/g,''))?.classList.remove('active');
  if (state.activeTab === path) {
    if (state.tabs.length) activateTab(state.tabs[state.tabs.length - 1]);
    else showWelcome();
  }
}

function showWelcome() {
  state.activeTab = null;
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('diffViewer').style.display = 'none';
}

// ── Diff rendering ─────────────────────────────────────────────
function renderDiff(filePath) {
  document.getElementById('welcome').style.display = 'none';
  const viewer = document.getElementById('diffViewer');
  viewer.style.display = 'block';

  const rawDiff = state.rawDiff;
  if (!rawDiff) {
    viewer.innerHTML = `<div style="padding:40px 20px;color:#484f58;font-family:monospace;font-size:12px">
      <div style="color:#8b949e;font-size:14px;margin-bottom:8px">📄 ${esc(filePath)}</div>
      Diff was fetched from GitHub API — raw content not stored locally.<br>
      <span style="color:#484f58">The AI review panel on the right contains the full analysis.</span>
    </div>`;
    return;
  }

  const html = parseDiffSection(rawDiff, filePath);
  viewer.innerHTML = html || `<div style="padding:40px 20px;color:#484f58;font-family:monospace;font-size:12px">
    No diff content found for <strong style="color:#8b949e">${esc(filePath)}</strong>.
  </div>`;
}

function parseDiffSection(fullDiff, targetPath) {
  const sections = fullDiff.split(/(?=^diff --git )/m);
  let out = '';

  for (const section of sections) {
    const pathMatch = section.match(/^\+\+\+ b\/(.+)/m);
    if (!pathMatch) continue;
    const fp = pathMatch[1].trim();
    if (fp !== targetPath) continue;

    let addLine = 1, remLine = 1;
    out += `<div class="diff-file-header">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="#8b949e"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Z"/></svg>
      <span class="file-path">${esc(fp)}</span>
    </div>`;

    for (const line of section.split('\n')) {
      if (line.startsWith('@@')) {
        const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)/);
        if (m) { remLine = +m[1]; addLine = +m[2]; }
        out += `<div class="diff-hunk-header">${esc(line)}</div>`;
      } else if (line.startsWith('+') && !line.startsWith('+++')) {
        out += `<div class="diff-line added"><span class="diff-line-num">${addLine++}</span><span class="diff-line-content">${esc(line.slice(1))}</span></div>`;
      } else if (line.startsWith('-') && !line.startsWith('---')) {
        out += `<div class="diff-line removed"><span class="diff-line-num">${remLine++}</span><span class="diff-line-content">${esc(line.slice(1))}</span></div>`;
      } else if (!line.startsWith('diff ') && !line.startsWith('index ') && !line.startsWith('--- ') && !line.startsWith('+++ ')) {
        out += `<div class="diff-line context"><span class="diff-line-num">${addLine}</span><span class="diff-line-content">${esc(line)}</span></div>`;
        addLine++; remLine++;
      }
    }
    break;
  }
  return out;
}

// ── File tree ──────────────────────────────────────────────────
function buildFileTree(data) {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = '';

  // Group changed files by top-level folder
  const groups = {};
  (data.changed_files || []).forEach(path => {
    const parts = path.split('/');
    const folder = parts.length > 1 ? parts[0] : '(root)';
    (groups[folder] = groups[folder] || []).push(path);
  });

  Object.entries(groups).forEach(([folder, files]) => {
    const folderEl = document.createElement('div');
    folderEl.className = 'tree-folder open';
    folderEl.innerHTML = `<span class="chevron">▶</span><span style="margin-left:4px">📁 ${esc(folder)}</span>`;

    const childList = document.createElement('div');
    folderEl.addEventListener('click', () => {
      folderEl.classList.toggle('open');
      childList.style.display = folderEl.classList.contains('open') ? '' : 'none';
    });
    tree.appendChild(folderEl);

    files.forEach(path => {
      const name = path.split('/').pop();
      const fileEl = document.createElement('div');
      fileEl.className = 'tree-file changed';
      fileEl.id = 'tree-file-' + btoa(path).replace(/=/g,'');
      fileEl.title = path;
      fileEl.innerHTML = `<span>📄 ${esc(name)}</span><span class="file-dot"></span>`;
      fileEl.addEventListener('click', () => activateTab(path));
      childList.appendChild(fileEl);
    });
    tree.appendChild(childList);
  });

  // Impacted files section
  if (data.impacted_files?.length) {
    const sepEl = document.createElement('div');
    sepEl.className = 'sidebar-section-header';
    sepEl.style.marginTop = '8px';
    sepEl.innerHTML = '<span>Blast Radius</span>';
    tree.appendChild(sepEl);

    data.impacted_files.forEach(path => {
      const name = path.split('/').pop();
      const fileEl = document.createElement('div');
      fileEl.className = 'tree-file';
      fileEl.style.paddingLeft = '16px';
      fileEl.title = path;
      fileEl.innerHTML = `<span style="color:#e3b341">⚡</span><span style="margin-left:4px;color:#e3b341">${esc(name)}</span>`;
      tree.appendChild(fileEl);
    });
  }
}

// ── Review panel ───────────────────────────────────────────────
function buildPanel(data) {
  const body = document.getElementById('panelBody');
  const risk = (data.risk_level || 'unknown').toLowerCase();
  body.innerHTML = '';

  // Risk
  const s1 = document.createElement('div');
  s1.className = 'panel-section';
  s1.innerHTML = `<div class="panel-section-title">Risk Assessment</div>
    <span class="risk-badge ${risk}"><span class="risk-dot"></span>${risk.toUpperCase()}</span>`;
  body.appendChild(s1);

  // Summary
  const s2 = document.createElement('div');
  s2.className = 'panel-section';
  s2.innerHTML = `<div class="panel-section-title">Summary</div>
    <div class="summary-text">${esc(data.summary || '—')}</div>`;
  body.appendChild(s2);

  // Symbols
  if (data.changed_symbols?.length) {
    const s3 = document.createElement('div');
    s3.className = 'panel-section';
    s3.innerHTML = `<div class="panel-section-title">Changed Symbols</div>
      <div class="symbol-chips">${data.changed_symbols.map(s => `<span class="symbol-chip">${esc(s)}</span>`).join('')}</div>`;
    body.appendChild(s3);
  }

  // Blast radius
  const s4 = document.createElement('div');
  s4.className = 'panel-section';
  s4.innerHTML = `<div class="panel-section-title">Blast Radius (${(data.impacted_files||[]).length} files)</div>`;
  if (data.impacted_files?.length) {
    const chips = document.createElement('div');
    chips.className = 'file-chips';
    data.impacted_files.forEach(f => {
      chips.innerHTML += `<span class="file-chip"><span class="chip-icon">⚡</span>${esc(f)}</span>`;
    });
    s4.appendChild(chips);
  } else {
    s4.innerHTML += `<div style="font-size:12px;color:#484f58;font-style:italic">No dependent files found.</div>`;
  }
  body.appendChild(s4);

  // Test suggestions
  const s5 = document.createElement('div');
  s5.className = 'panel-section';
  s5.innerHTML = `<div class="panel-section-title">Suggested Missing Tests</div>`;
  if (data.missing_tests?.length) {
    data.missing_tests.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'test-card';
      card.innerHTML = `<span class="test-num">${i+1}</span><span class="test-text">${esc(t)}</span>`;
      s5.appendChild(card);
    });
  } else {
    s5.innerHTML += `<div style="font-size:12px;color:#484f58;font-style:italic">No suggestions returned.</div>`;
  }
  body.appendChild(s5);
}

// ── Panel toggle ───────────────────────────────────────────────
function togglePanel() {
  state.panelOpen = !state.panelOpen;
  const shell = document.getElementById('shell');
  const panel = document.getElementById('panel');
  const btn   = document.getElementById('btn-panel-toggle');
  if (state.panelOpen) {
    shell.classList.add('panel-open');
    panel.style.display = 'flex';
    btn.classList.add('active');
  } else {
    shell.classList.remove('panel-open');
    panel.style.display = 'none';
    btn.classList.remove('active');
  }
}
</script>
