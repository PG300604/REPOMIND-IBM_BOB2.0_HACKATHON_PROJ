name: Render Backend Keep-Alive Ping

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier 15-minute inactivity spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://repomind-backend.onrender.com' }}
        run: |
          echo "Sending keep-alive ping to ${BACKEND_URL}/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BACKEND_URL}/health" || echo "failed")
          echo "Keep-alive response status: $STATUS"
